name: Auto Tag & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      tag_created: ${{ steps.check_tag.outputs.tag_created }}
      version: ${{ steps.package_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Get version from package.json
        id: package_version
        run: |
          $version = Get-Content package.json | ConvertFrom-Json | Select-Object -ExpandProperty version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh

      - name: Check if tag exists
        id: check_tag
        run: |
          git fetch --tags
          $version = "${{ steps.package_version.outputs.version }}"
          $tagExists = & git tag -l "v$version"
          if ($tagExists) {
            "tag_created=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Tag v$version already exists — skipping release."
          } else {
            "tag_created=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
        shell: pwsh

      - name: Create and push tag
        if: steps.check_tag.outputs.tag_created == 'true'
        run: |
          $version = "${{ steps.package_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "Release v$version"
          git push origin "v$version"
        shell: pwsh

      - name: Build Vite + Electron app
        if: steps.check_tag.outputs.tag_created == 'true'
        run: npx vite build && npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifacts
        if: steps.check_tag.outputs.tag_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/
          retention-days: 5

  create-release:
    needs: release
    runs-on: windows-latest
    if: needs.release.outputs.tag_created == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          name: Release v${{ needs.release.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
